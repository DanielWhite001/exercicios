<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tabelas</title>

        <style>
                body {
                        font-family: Arial, Helvetica, sans-serif;

                }

                table {
                        width: 400px;
                        height: 400px;
                        border-collapse: collapse;
                }

                td {
                        border: 1px solid black;
                        padding: 8px;
                        text-align: center; /*alinhamento horizontal*/
                        vertical-align: bottom; /*alinhamento vertical*/
                }

                .numero{
                        text-align: right;
                }

        </style>
</head>
<body>
        <h1>Aprendendo sobre tabelas</h1>                      

        <table>

                <!--HIERARQUIA DE TABELAS (simples)
                TABLE = Tabela
                TABLE ROW = linha da tabela
                TABLE HEADER = cabeçalho da tabela
                TABLE DATA = dado da tabela
                -->
                
                <tr> <!--Primeira linha-->
                        <td>A1</td>
                        <td>B1</td>
                        <td>C1</td>
                </tr>

                <tr>
                        <td>A2</td>
                        <td>B2</td>
                        <td class="numero">C2</td>
                </tr>

                <tr>
                        <td>A3</td>
                        <td>B3</td>
                        <td class="numero">C3</td>
                </tr>

        </table>
</body>
</html>
